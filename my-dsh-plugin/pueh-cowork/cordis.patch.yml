# Pueh Cowork (pueh-cowork) — migrated from the legacy
# `~/.dsh/.agent-presets/pueh-cowork/` directory to an installed bundle
# declaration, because nothing reads the legacy directory any more.
#
# On top of the Pueh Chat preset: workspace file read/write and search
# (tool-fs / tool-fs-search), the skill catalog and loader (tool-skill +
# skill-filesystem), and background subagent delegation (subagent /
# subagent_fork plus their control tools). Ask-user, web search and automatic
# compaction are kept. No shell tool.
- insert:
    - id: preset-pueh-cowork
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pueh-cowork
        name: Pueh Cowork
        description: '在 Pueh Chat 基础上增加：工作区文件读写与搜索、后台子代理委派、技能加载；保留反问与联网搜索。'
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful assistant. You can read and modify files in your workspace, search the web, load named skills, and delegate work to background subagents.
              complete: true
              includeRuntimeContext: false

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          # ── filesystem ────────────────────────────────────────────────────
          # Both register into the host `tools` registry and provide nothing,
          # so they need no realm. The `fs` service and its policy stay in the
          # host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── skills ────────────────────────────────────────────────────────
          # The skill REGISTRY lives in the host composition and is layered per
          # scope; these rows register into THIS preset's layer of it, so they
          # need no realm.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── delegation ────────────────────────────────────────────────────
          # The `subagents` registry and its spawn/fork backends live in the
          # HOST composition. This preset contributes the delegation TOOLS,
          # which resolve that host registry. They register tools only and
          # publish no service, so no realm is needed.
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'

          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              backgroundMode: continuable

          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable

          # Compaction lives in an entry-local realm exactly like the shipped
          # `standard` preset: the backend registers per-agent while the host
          # token meter stays global.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
